[build]
command = "python3 gen.py && python3 gwacheon_v1_addon.py && python3 national_bulk.py && mkdir -p out_gangnam/admin && cp admin.html out_gangnam/admin/index.html && cp admin.html out_gangnam/admin.html && cp admin_assets/style.css out_gangnam/style.css && cp data/services.json out_gangnam/services.json && cp data/nationwide_regions.json out_gangnam/nationwide_regions.json"
publish = "out_gangnam"
functions = "netlify/functions"

[build.environment]
PYTHON_VERSION = "3.13"
CB_GU = "gangnam"
BULK_LIMIT = "8000"

[functions]
node_bundler = "esbuild"

[functions."generate-batch-background"]
background = true
[functions."publish-mass-background"]
background = true
[functions."indexnow-background"]
background = true

[[headers]]
for = "/admin/*"
  [headers.values]
  Cache-Control = "no-store"
  X-Robots-Tag = "noindex, nofollow"
[[headers]]
for = "/admin.html"
  [headers.values]
  Cache-Control = "no-store"
  X-Robots-Tag = "noindex, nofollow"
[[headers]]
for = "/.netlify/functions/*"
  [headers.values]
  Cache-Control = "no-store"
